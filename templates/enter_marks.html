{% extends "base.html" %}
{% block title %}Enter Marks{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm">
            <div class="card-header bg-warning text-dark">
                <h5 class="mb-0"><i class="bi bi-pencil-square"></i> Enter Student Marks</h5>
            </div>
            <div class="card-body">
                {% if msg %}
                    {% if 'SUCCESS' in msg %}
                    <div class="alert alert-success">{{ msg.replace('SUCCESS: ', '') }}</div>
                    {% endif %}
                {% endif %}

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Select Student</label>
                        <select class="form-select" name="student_id" title="Select Student" required>
                            <option value="">-- Select Student --</option>
                            {% for s in students %}
                            <option value="{{ s.id }}">
                                {{ s.name }} (Roll: {{ s.roll_no }} | {{ s.section_name }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Subjects</label>
                        <select class="form-select" name="subject" title="Select Subject" required>
                            <option value="">-- Select Subject --</option>
                            {% for sub in subjects %}
                            <option value="{{ sub.subject_name }}">{{ sub.subject_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Exam Name</label>
                        <input type="text" class="form-control" name="exam_name" placeholder="e.g. Half Yearly, Annual" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Marks Obtained</label>
                            <input type="number" class="form-control" name="marks_obtained" min="0" max="200" placeholder="e.g. 45" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Total Marks</label>
                            <input type="number" class="form-control" name="total_marks" min="1" max="200" placeholder="e.g. 50" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Exam Date</label>
                        <input type="date" class="form-control" name="exam_date" title="Exam Date" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-warning">
                            <i class="bi bi-save"></i> Save Marks
                        </button>
                        <a href="{{ url_for('teacher_marks') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-table"></i> View All Marks
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
