{% extends "base.html" %}
{% block title %}Edit Marks{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm">
            <div class="card-header bg-warning text-dark">
                <h5 class="mb-0"><i class="bi bi-pencil"></i> Edit Marks Entry</h5>
            </div>
            <div class="card-body">
                {% if msg %}
                    {% if 'SUCCESS' in msg %}
                    <div class="alert alert-success">{{ msg.replace('SUCCESS: ', '') }}</div>
                    {% else %}
                    <div class="alert alert-danger">{{ msg }}</div>
                    {% endif %}
                {% endif %}

                <div class="alert alert-light border mb-3">
                    <small class="text-muted">Editing marks for student ID: {{ mark.student_id }}</small>
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Subject</label>
                        <select class="form-select" name="subject" title="Select Subject" required>
                            {% for sub in subjects %}
                            <option value="{{ sub.subject_name }}"
                                {% if mark.subject == sub.subject_name %}selected{% endif %}>
                                {{ sub.subject_name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Exam Name</label>
                        <input type="text" class="form-control" name="exam_name" value="{{ mark.exam_name }}" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Marks Obtained</label>
                            <input type="number" class="form-control" name="marks_obtained" value="{{ mark.marks_obtained }}" min="0" max="200" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Total Marks</label>
                            <input type="number" class="form-control" name="total_marks" value="{{ mark.total_marks }}" min="1" max="200" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Exam Date</label>
                        <input type="date" class="form-control" name="exam_date" title="Exam Date" value="{{ mark.exam_date }}" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-warning">
                            <i class="bi bi-check-lg"></i> Update Marks
                        </button>
                        <a href="{{ url_for('teacher_marks') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
