{% extends "base.html" %}
{% block title %}Change Password{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0"><i class="bi bi-key"></i> Change Password</h5>
            </div>
            <div class="card-body">
                {% if msg %}
                    {% if 'SUCCESS' in msg %}
                    <div class="alert alert-success">
                        <i class="bi bi-check-circle"></i> {{msg.replace('SUCCESS: ', '') }}
                    </div>
                    {% else %}
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-circle"></i> {{msg.replace('ERROR: ', '') }}
                    </div>
                    {% endif %}
                {% endif %}

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Current Password</label>
                        <input type="password" class="form-control" name="old_password" placeholder="Enter current password" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">New Password</label>
                        <input type="password" class="form-control" name="new_password" placeholder="Enter new password" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Confirm New Password</label>
                        <input type="password" class="form-control" name="confirm_password" placeholder="Re-enter new password" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-dark">
                            <i class="bi bi-shield-lock"></i> Change Password
                        </button>
                        <a href="{{ url_for('student_dashboard') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Back to Dashboard
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
