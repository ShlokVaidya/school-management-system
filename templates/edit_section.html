{% extends "base.html" %}
{% block title%}Edit Section{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header bg-warning text-dark">
                <h5 class="mb-0"><i class="bi bi-pencil"></i> Edit Section</h5>
            </div>
            <div class="card-body">
                {% if msg %}
                    {% if 'SUCCESS' in msg %}
                    <div class="alert alert-success">{{ msg.replace('SUCCESS: ', '') }}</div>
                    {% else %}
                    <div class="alert alert-danger">{{ msg }}</div>
                    {% endif %}
                {% endif %}

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Section Name</label>
                        <input type="text" class="form-control" name="section_name"
                            value="{{ section.section_name }}" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-warning">
                            <i class="bi bi-check-lg"></i> Save Changes
                        </button>
                        <a href="{{ url_for('admin_sections') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
