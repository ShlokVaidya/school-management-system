{% extends "base.html" %}
{% block title %}Add Assignment{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm">
            <div class="card-header bg-info text-white">
                <h5 class="mb-0"><i class="bi bi-journal-plus"></i> Create New Assignment</h5>
            </div>
            <div class="card-body">
                {% if msg %}
                    {% if 'SUCCESS' in msg %}
                    <div class="alert alert-success">{{ msg.replace('SUCCESS: ', '') }}</div>
                    {% endif %}
                {% endif %}

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Assignment Title</label>
                        <input type="text" class="form-control" name="title" placeholder="Title" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold"> Description / Instructions</label>
                        <textarea class="form-control" name="description" rows="3" placeholder="What students need to do..."></textarea>
                    </div>    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Subject</label>
                            <select class="form-select" name="subject" title="Select Subject" required>
                                <option value="">-- Select Subject --</option>
                                {% for sub in subjects %}
                                <option value="{{ sub.subject_name }}">{{ sub.subject_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Due Date</label>
                            <input type="date" class="form-control" name="due_date" title="Due Date" required>
                        </div>
                    </div>     
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Assign to Section</label>
                        <select class="form-select" name="section_id" title="Select Section" required>
                            <option value="">-- Select Section--</option>
                            {% for sec in sections %}
                            <option value="{{ sec.id }}">{{ sec.section_name }}</option>
                            {% endfor %}
                        </select>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-info text-white">
                                <i class="bi bi-send"></i> Create Assignment
                            </button>
                            <a href="{{ url_for('teacher_assignments') }}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left"></i> Back
                            </a>
                        </div>
                    </div>           
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
